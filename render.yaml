services:
  # 1. FastAPI Web Service
  - type: web
    name: cit-campus-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cit_scheduling
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SOLVER_TIME_LIMIT_SEC
        value: "40"
      - key: SOLVER_NUM_WORKERS
        value: "2"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://cit-campus-scheduling.vercel.app"

  # 2. Solver Background Worker (Optional: requires Render Starter/Paid plan)
  # Uncomment below if you have a Render paid plan to run background job queues.
  # On the free tier, the FastAPI Web Service handles scheduling and bookings directly.
